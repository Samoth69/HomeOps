---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: namespace-ingress-${APP}
  namespace: &namespace network
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: &app ${APP}
  dependsOn:
    - name: namespace-ingress
      namespace: network
  interval: 1h
  path: ./clusters/k4/kubernetes/components/namespace-ingress/app/input
  postBuild:
    substitute:
      APP: *app
      LISTENER_SSH: "false"
      LISTENER_POSTGRES: "false"
  prune: true
  retryInterval: 2m
  targetNamespace: *namespace
  timeout: 5m
  wait: false
