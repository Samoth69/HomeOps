# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/external-secrets.io/secretstore_v1.json
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: ${APP}-kubernetes
spec:
  provider:
    kubernetes:
      # TODO find a better way to pass this value
      remoteNamespace: ${NAMESPACE}
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: ${APP}-kubernetes-store
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ${APP}-kubernetes-store
rules:
- apiGroups: [""]
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - authorization.k8s.io
  resources:
  - selfsubjectrulesreviews
  verbs:
  - create
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${APP}-kubernetes-store
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${APP}-kubernetes-store
subjects:
  - kind: ServiceAccount
    name: ${APP}-kubernetes-store
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${APP}-kubernetes-store