---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/ocirepository-source-v1beta2.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: ${APP}-valkey-ha
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 0.25.11
  url: oci://mirror.gcr.io/cloudpirates/valkey
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app ${APP}-valkey-ha
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  values:
    image:
      registry: ghcr.io
      repository: valkey-io/valkey
      tag: 9.1.2-alpine
      pullPolicy: IfNotPresent
    
    architecture: replication

    replicaCount: 3

    commonAnnotations:
      reloader.stakater.com/auto: "true"
    
    resources:
      requests:
        cpu: 15m
        memory: 16Mi
      limits:
        memory: 128Mi
    
    pdb:
      enabled: true
      minAvailable: 2
    
    persistence:
      size: 128Mi

    auth:
      enabled: true
      existingSecret: ${APP}-valkey-ha-secret

    affinity:
      podAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/instance
                  operator: In
                  values:
                  - ${APP}
              topologyKey: kubernetes.io/hostname

    sentinel:
      enabled: true
      image:
        registry: ghcr.io
        repository: valkey-io/valkey
        tag: 9.1.2-alpine
        pullPolicy: IfNotPresent
      masterName: mymaster
      resources:
        requests:
          cpu: 15m
          memory: 16Mi
        limits:
          memory: 128Mi