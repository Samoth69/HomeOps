# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app openbao
spec:
  components:
    - ../../../../components/oauth2
    - ../../../../components/kopiur/backup-config
  dependsOn:
    - name: rook-ceph-cluster
      namespace: storage
    - name: kopiur
      namespace: system
  path: ./clusters/k4/kubernetes/apps/security/openbao/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: *app
  targetNamespace: security
  patches:
    - target:
        kind: StatefulSet
        group: apps
        version: v1
        name: openbao
      patch: |
        - op: add
          path: /spec/volumeClaimTemplates/0
          value:
            dataSourceRef:
              apiGroup: kopiur.home-operations.com
              kind: Restore
              name: ${APP}