# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app openbao
spec:
  components:
    - ../../../../components/oauth2
    - ../../../../components/kopiur/backup-config
  dependsOn:
    - name: rook-ceph-cluster
      namespace: storage
    - name: kopiur
      namespace: system
  path: ./clusters/k4/kubernetes/apps/security/openbao/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: *app
      KANIDM_REDIRECT_PATH: /ui/vault/auth/oidc/oidc/callback
  targetNamespace: security
