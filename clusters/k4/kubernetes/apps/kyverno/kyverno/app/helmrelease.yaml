---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: kyverno
  values:
    global:
      image:
        registry: ghcr.io
    admissionController:
      replicas: 3
      certManager:
        enabled: true
      priorityClassName: system-cluster-critical
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/component: admission-controller
          topologyKey: kubernetes.io/hostname
          maxSkew: 2
          whenUnsatisfiable: DoNotSchedule
      podLabels: &labels
        ingress.samoth.eu/vmagent: allow
        ingress.samoth.eu/kube-apiserver: allow
        egress.samoth.eu/kube-apiserver: allow
      podDisruptionBudget:
        enabled: true
      serviceMonitor:
        enabled: true
      container:
        resources:
          requests:
            cpu: 10m
            memory: 128Mi
          limits:
            memory: 1024Mi
    backgroundController:
      replicas: 1
      podLabels: *labels
      serviceMonitor:
        enabled: true
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 512Mi
    cleanupController:
      replicas: 1
      certManager:
        enabled: true
      podLabels: *labels
      serviceMonitor:
        enabled: true
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 512Mi
    reportsController:
      replicas: 1
      podLabels: *labels
      serviceMonitor:
        enabled: true
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 512Mi
    grafana:
      enabled: true
    crds:
      migration:
        podLabels: *labels