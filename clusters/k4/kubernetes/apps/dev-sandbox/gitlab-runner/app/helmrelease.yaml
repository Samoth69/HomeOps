---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/ocirepository-source-v1beta2.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: ${APP}
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 0.93.0
  url: oci://registry.gitlab.com/charts/charts.gitlab.io/release/gitlab-runner
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${APP}
spec:
  chartRef:
    kind: OCIRepository
    name: ${APP}
  interval: 1h
  values:
    gitlabUrl: https://gitlab.${SECRET_DOMAIN}/

    podLabels:
      ingress.samoth.eu/vmagent: allow
      ingress.samoth.eu/kube-apiserver: allow
      egress.samoth.eu/envoy-internal: allow
      egress.samoth.eu/kube-apiserver: allow

    startupProbe:
      httpGet:
        path: /health/ready
        port: 9252
      periodSeconds: 5
      failureThreshold: 30

    metrics:
      enabled: true
      podMonitor:
        enabled: true

    rbac:
      create: true
      rules:
        - resources: ["events"]
          verbs: ["list", "watch"]
        - resources: ["pods"]
          verbs: ["list","watch","create","delete","get"]
        - apiGroups: [""]
          resources: ["pods/attach","pods/exec"]
          verbs: ["get","create","patch","delete"]
        - apiGroups: [""]
          resources: ["pods/log"]
          verbs: ["get","list"]
        - resources: ["secrets"]
          verbs: ["create","delete","get","update"]
        - resources: ["serviceaccounts"]
          verbs: ["get"]
        - resources: ["services"]
          verbs: ["create","get"]

    runners:
      config: |
        [[runners]]
          [runners.kubernetes]
            allow_privilege_escalation = false
            cap_drop = ["all"]
            image = "alpine"
            namespace = "{{ default .Release.Namespace .Values.runners.jobNamespace }}"
            pull_policy = ["always", "if-not-present"]
            [runners.kubernetes.pod_labels]
              "egress.samoth.eu/envoy-internal" = "allow"

      secret: ${APP}