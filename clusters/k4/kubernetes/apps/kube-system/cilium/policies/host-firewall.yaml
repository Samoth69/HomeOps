# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: "cilium.io/v2"
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: host-firewall
spec:
  nodeSelector:
    matchLabels:
      node-role.kubernetes.io/control-plane: ""
  ingress:
    # Cilium requirements
    - fromEntities:
        - cluster
        - remote-node
        - health
    - toPorts:
        - ports:
            # Cilium health check
            - port: "4240"
              protocol: TCP
    - icmps:
        - fields:
            - family: IPv4
              type: 8
            - family: IPv6
              type: 8
            - family: IPv4
              type: EchoRequest
            - family: IPv6
              type: EchoRequest
    # Talos
    - fromCIDRSet:
        - cidrGroupRef: lan
      toPorts:
        - ports:
            # kubernetes-api-ingress
            - port: "6443"
              protocol: TCP
            # apid-ingress
            - port: "50000"
              protocol: TCP
            # trustd-ingress
            - port: "50001"
              protocol: TCP
  egress:
    - toEntities:
        - cluster
        - world
    - toCIDRSet:
        - cidrGroupRef: lan
