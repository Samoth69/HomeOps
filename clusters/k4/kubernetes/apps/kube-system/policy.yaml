---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/policies.kyverno.io/policyexception_v1.json
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: exception-kube-system
spec:
  policyRefs:
    - name: disallow-capabilities
      kind: ValidatingPolicy
    - name: disallow-host-namespaces
      kind: ValidatingPolicy
    - name: disallow-host-path
      kind: ValidatingPolicy
    - name: disallow-host-ports
      kind: ValidatingPolicy
    - name: disallow-host-probes
      kind: ValidatingPolicy
    - name: disallow-privileged-containers
      kind: ValidatingPolicy
    - name: disallow-selinux
      kind: ValidatingPolicy
    - name: restrict-apparmor-profiles
      kind: ValidatingPolicy
    - name: restrict-seccomp
      kind: ValidatingPolicy
  matchConditions:
    - name: namespace
      expression: "object.metadata.namespace == 'kube-system'"
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/policies.kyverno.io/policyexception_v1.json
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: exception-host-ports
spec:
  policyRefs:
    - name: disallow-host-ports
      kind: ValidatingPolicy
  matchConditions:
    - name: namespace
      expression: "object.metadata.namespace == 'kube-system'"
  images:
    - quay.io/cilium/operator-generic:*