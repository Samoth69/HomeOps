---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
handler: runsc
---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor-kvm
handler: runsc-kvm
# It's not recommanded to run nested virtualization : https://gvisor.dev/docs/user_guide/platforms/
scheduling:
  nodeSelector:
    feature.node.kubernetes.io/cpu-model.hypervisor: none