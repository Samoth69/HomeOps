---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app namespace-ingress
spec:
  dependsOn:
    - name: envoy-gateway
      namespace: network
  healthChecks:
    - kind: ResourceSet
      name: *app
      namespace: network
      apiVersion: fluxcd.controlplane.io/v1
  interval: 1h
  path: ./clusters/k4/kubernetes/apps/network/namespace-ingress/app
  postBuild:
    substitute:
      APP: *app
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  targetNamespace: network
  wait: false
