---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.envoyproxy.io/clienttrafficpolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: envoy
spec:
  clientIPDetection:
    xForwardedFor:
      trustedCIDRs:
        # pods CIDR
        - 10.48.0.0/16
        - fd00:48::/56
  path:
    escapedSlashesAction: KeepUnchanged
  http2:
    onInvalidMessage: TerminateStream
  # http3: {}
  targetSelectors:
    - group: gateway.networking.k8s.io
      kind: Gateway
  tcpKeepalive: {}
  timeout:
    tcp:
      idleTimeout: 10s
    http:
      idleTimeout: 60s
  tls:
    alpnProtocols:
      - h2
      - http/1.1
    # We do not want envoy to valide the cert provided by cert manager
    clientValidation:
      mode: RequireAny
    minVersion: "1.3"