---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app mc-atm10-01
  namespace: flux-system
spec:
  dependsOn:
    - name: kopiur-repository
      namespace: system
  interval: 1h
  path: ./clusters/k4/kubernetes/apps/games/mc-atm10-01/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: *app
      KOPIUR_STORAGECLASS: ceph-filesystem
      KOPIUR_CAPACITY: 50Gi
      KOPIUR_ACCESSMODES: ReadWriteMany
      KOPIUR_SNAPSHOTCLASS: csi-ceph-filesystem
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: games
  wait: true
  components:
    - ../../../../components/kopiur/backup