---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/helmrepository-source-v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: kedacore
spec:
  interval: 1h
  url: https://kedacore.github.io/charts
  timeout: 3m
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda
spec:
  interval: 30m
  chart:
    spec:
      chart: keda
      version: 2.20.2
      sourceRef:
        kind: HelmRepository
        name: kedacore
  values:
    clusterName: k4
    metricsServer:
      replicaCount: 2
    webhooks:
      replicaCount: 2
    
    podDisruptionBudget:
      metricsServer:
        minAvailable: 1
      webhooks:
        minAvailable: 1
    
    additionalAnnotations:
      reloader.stakater.com/auto: "true"

    podLabels:
      keda: &labels
        ingress.samoth.eu/kube-apiserver: allow
        egress.samoth.eu/kube-apiserver: allow
        egress.samoth.eu/envoy-internal: allow
      metricsAdapter: *labels
      webhooks: *labels

    resources:
      # -- Manage [resource request & limits] of KEDA operator pod
      operator:
        limits:
          memory: 1000Mi
        requests:
          cpu: 10m
          memory: 100Mi
      # -- Manage [resource request & limits] of KEDA metrics apiserver pod
      metricServer:
        limits:
          memory: 1000Mi
        requests:
          cpu: 10m
          memory: 100Mi
      # -- Manage [resource request & limits] of KEDA admission webhooks pod
      webhooks:
        limits:
          memory: 1000Mi
        requests:
          cpu: 10m
          memory: 100Mi
    
    certificates:
      secretName: &cert kedaorg-ca
      certManager:
        enabled: true
        duration: 30d
        renewBefore: 7d
        caSecretName: *cert