---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app keda
  namespace: flux-system
spec:
  components:
    - ../../../../components/app-network-policy
  dependsOn:
    - name: cert-manager
      namespace: cert-manager
  interval: 1h
  path: ./clusters/k4/kubernetes/apps/infrastructure/keda/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: *app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: infrastructure
  wait: true
