---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/ocirepository-source-v1beta2.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: ${APP}
spec:
  interval: 15m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 6.4.0
  url: oci://ghcr.io/mogenius/helm-charts/renovate-operator
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${APP}
spec:
  chartRef:
    kind: OCIRepository
    name: ${APP}
  interval: 1h
  values:
    fullnameOverride: ${APP}

    crd:
      mode: template

    deployment:
      annotations:
        reloader.stakater.com/auto: "true"
      podLabels:
        ingress.samoth.eu/kube-apiserver: allow
        ingress.samoth.eu/envoy-internal: allow
        egress.samoth.eu/kube-apiserver: allow
        egress.samoth.eu/envoy-internal: allow
    
    config:
      podLabelTemplates:
        ingress.samoth.eu/envoy-internal: allow
        egress.samoth.eu/envoy-internal: allow
        egress.samoth.eu/truenas-https: allow
        egress.samoth.eu/internet-http: allow
      logStorage:
        # TODO: send logs to S3
        mode: disabled

    route:
      enabled: true
      hostnames:
        - ${APP}.${SECRET_DOMAIN}
      parentRefs:
        - name: envoy-internal
          namespace: network
          sectionName: https
    
    auth:
      oidc:
        enabled: true
        issuerUrl: https://idm.${SECRET_DOMAIN}/oauth2/openid/${APP}
        clientId: ${APP}
        existingSecret: ${APP}-kanidm-oauth2-credentials
        secretKey: CLIENT_SECRET
        redirectUrl: https://idm.${SECRET_DOMAIN}/auth/callback

    rbac:
      ownNamespaceOnly: true