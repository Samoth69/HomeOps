# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-es
spec:
  refreshInterval: 10m
  secretStoreRef:
    kind: SecretStore
    name: ${APP}-kubernetes
  target:
    name: ${APP}-extra-config
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        # https://kanidm.github.io/kanidm/stable/integrations/oauth2/examples.html#gitlab
        oidc-provider: |
          {
            name: "openid_connect",
            label: "Kanidm",
            icon: "https://idm.${SECRET_DOMAIN}/pkg/img/favicon.png",
            args: {
              name: "openid_connect",
              scope: ["openid", "profile", "email"],
              response_type: "code",
              issuer: "https://idm.${SECRET_DOMAIN}/oauth2/openid/gitlab",
              discovery: true,
              client_auth_method: "query",
              uid_field: "preferred_username",
              pkce: true,
              client_options: {
                identifier: "{{ .CLIENT_ID }}",
                secret: "{{ .CLIENT_SECRET }}",
                redirect_uri: "https://gitlab.${SECRET_DOMAIN}/users/auth/openid_connect/callback"
              }
            }
          }
        # https://docs.gitlab.com/administration/cicd/secure_files/#s3-compatible-connection-settings
        s3-connection: |
          {
            endpoint: "https://ceph-object-store.${SECRET_DOMAIN}",
            path_style: true,
            aws_access_key_id: "{{ .AWS_ACCESS_KEY_ID }}",
            aws_secret_access_key: "{{ .AWS_SECRET_ACCESS_KEY }}"
          }
  data:
    - secretKey: CLIENT_ID
      remoteRef:
        key: ${APP}-kanidm-oauth2-credentials
        property: CLIENT_ID
    - secretKey: CLIENT_SECRET
      remoteRef:
        key: ${APP}-kanidm-oauth2-credentials
        property: CLIENT_SECRET
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: ${APP}-s3-bucket
        property: AWS_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: ${APP}-s3-bucket
        property: AWS_SECRET_ACCESS_KEY
    