---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app gitlab
spec:
  components:
    - ../../../../components/oauth2
    - ../../../../components/database
    - ../../../../components/external-secrets-kubernetes-store
    - ../../../../components/kopiur/backup
    - ../../../../components/valkey-ha
  dependsOn:
    - name: kopiur-repository
      namespace: system
    - name: postgres-cnpg
      namespace: database
  path: ./clusters/k4/kubernetes/apps/dev/gitlab/app
  targetNamespace: &namespace dev
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: *app
      NAMESPACE: *namespace
      KOPIUR_PVC_NAME: repo-data-gitlab-gitaly-0
      KANIDM_REDIRECT_PATH: /users/auth/openid_connect/callback
      KANIDM_SECRET_ROTATION: "false"
  patches:
    - target:
        kind: StatefulSet
        group: apps
        version: v1
        name: gitlab-gitaly
      patch: |
        - op: add
          path: /spec/volumeClaimTemplates/0
          value:
            dataSourceRef:
              apiGroup: kopiur.home-operations.com
              kind: Restore
              name: ${APP}