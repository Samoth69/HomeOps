---
# yaml-language-server: $schema=https://k8s-schemas.m00nlit.dev/keda.sh/triggerauthentication_v1alpha1.json
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: ${APP}-creds
spec:
  secretTargetRef:
    - parameter: token
      name: ${APP}-secret
      key: SCALER_TOKEN
---
# yaml-language-server: $schema=https://k8s-schemas.m00nlit.dev/keda.sh/scaledobject_v1alpha1.json
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: ${APP}
spec:
  scaleTargetRef:
    kind: StatefulSet
    name: ${APP}
  minReplicaCount: 0
  maxReplicaCount: 2
  pollingInterval: 30
  triggers:
    - type: forgejo-runner
      metadata:
        name: "runner"
        address: "https://forgejo.${SECRET_DOMAIN}"
        global: "true"
        labels: "ubuntu-latest"
      authenticationRef:
        name: ${APP}-creds