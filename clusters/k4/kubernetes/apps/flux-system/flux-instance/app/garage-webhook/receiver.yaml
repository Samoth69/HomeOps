---
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Receiver
metadata:
  name: garage-receiver
spec:
  type: generic
  secretRef:
    name: ${APP}-garage-webhook
  resources:
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: Bucket
      name: flux-system
      namespace: flux-system
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      name: cluster-apps
      namespace: flux-system