# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app paperless
spec:
  components:
    - ../../../../components/oauth2
    - ../../../../components/database
    - ../../../../components/external-secrets-kubernetes-store
    - ../../../../components/kopiur/backup
    - ../../../../components/valkey
  dependsOn:
    - name: kopiur-repository
      namespace: system
    - name: rook-ceph-cluster
      namespace: storage
    - name: postgres-cnpg
      namespace: database
  interval: 1h
  path: ./clusters/k4/kubernetes/apps/selfhosted/paperless/app
  targetNamespace: &namespace selfhosted
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: *app
      NAMESPACE: *namespace
      KOPIUR_CAPACITY: 20Gi
      KOPIUR_PGID: "2000"
      KOPIUR_PUID: "2000"
      KANIDM_REDIRECT_PATH: /accounts/oidc/kanidm/login/callback/
