# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app paperless
spec:
  components:
    - ../../../../components/oauth2
    - ../../../../components/database
    - ../../../../components/external-secrets-kubernetes-store
    - ../../../../components/valkey
    - ../../../../components/volsync
  dependsOn:
    - name: postgres-cnpg
      namespace: database
    - name: volsync
      namespace: system
  interval: 1h
  path: ./clusters/k4/kubernetes/apps/selfhosted/paperless/app
  targetNamespace: &namespace selfhosted
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: *app
      NAMESPACE: *namespace
      VOLSYNC_CAPACITY: 20Gi
      KANIDM_REDIRECT_PATH: /accounts/oidc/kanidm/login/callback/
