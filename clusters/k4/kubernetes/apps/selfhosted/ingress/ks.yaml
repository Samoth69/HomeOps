# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app ingress
spec:
  components:
    - ../../../../components/namespace-ingress
  interval: 1h
  path: ./clusters/k4/kubernetes/apps/selfhosted/ingress/app
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: selfhosted
      LISTENER_SSH: "false"
      LISTENER_POSTGRES: "false"
  prune: true
  targetNamespace: network
  wait: false
