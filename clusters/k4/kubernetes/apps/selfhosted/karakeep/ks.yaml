# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app karakeep
spec:
  components:
    - ../../../../components/app-network-policy
    - ../../../../components/kopiur/backup
    - ../../../../components/oauth2
  dependsOn:
    - name: kopiur-repository
      namespace: system
    - name: rook-ceph-cluster
      namespace: storage
  path: ./clusters/k4/kubernetes/apps/selfhosted/karakeep/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: *app
      KANIDM_REDIRECT_PATH: /api/auth/callback/custom
  targetNamespace: selfhosted
