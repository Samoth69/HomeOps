# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app karakeep
spec:
  components:
    - ../../../../components/app-network-policy
    - ../../../../components/volsync
  path: ./clusters/k4/kubernetes/apps/selfhosted/karakeep/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: *app
  targetNamespace: selfhosted
