---
# yaml-language-server: $schema=https://json.schemastore.org/helmfile

helmDefaults:
  cleanupOnFail: true
  wait: true
  waitForJobs: true

releases:
  - name: cilium
    namespace: kube-system
    chart: oci://quay.io/cilium/charts/cilium
    version: 1.20.1
    values:
      - ./templates/values.yaml.gotmpl
      # Durring bootstrap we need to disable hubble because it need dns to work
      # But DNS aren't installed at this stage.
      # - hubble:
      #     enabled: false
      #     relay:
      #       enabled: false

  - name: coredns
    namespace: kube-system
    chart: oci://ghcr.io/coredns/charts/coredns
    version: 1.47.0
    values:
      - ./templates/values.yaml.gotmpl
    needs:
      - kube-system/cilium

  - name: spegel
    namespace: kube-system
    chart: oci://ghcr.io/spegel-org/helm-charts/spegel
    version: 0.7.4
    values:
      - ./templates/values.yaml.gotmpl
    needs:
      - kube-system/coredns
  
  # Needed by Kyverno, will be required to bootstrap the cluster
  - name: cert-manager
    namespace: cert-manager
    chart: oci://quay.io/jetstack/charts/cert-manager
    version: 1.21.1
    values:
      - ./templates/values.yaml.gotmpl
    needs:
      - kube-system/coredns
  
  - name: kyverno
    namespace: kyverno
    chart: oci://ghcr.io/kyverno/charts/kyverno
    version: 3.9.0
    values:
      - ./templates/values.yaml.gotmpl
    needs:
      - cert-manager/cert-manager
