    # END gitlab.scripts.configure.secrets
  database.yml.erb: "\nproduction:\n  main:\n    adapter: postgresql\n    encoding:
    unicode\n    database: gitlab\n    username: gitlab\n    password: <%= File.read('/etc/gitlab/postgres/psql-password-main').strip.to_json
    %>\n    host: \"pooler-transaction-rw.database.svc.cluster.local\"\n    port:
    5432\n    connect_timeout: \n    keepalives: \n    keepalives_idle: \n    keepalives_interval:
    \n    keepalives_count: \n    tcp_user_timeout: \n    application_name: \n    prepared_statements:
    false\n    database_tasks: true\n    \n    \n  ci:\n    adapter: postgresql\n
    \   encoding: unicode\n    database: gitlab-ci\n    username: gitlab-ci\n    password:
    <%= File.read('/etc/gitlab/postgres/psql-password-ci').strip.to_json %>\n    host:
    \"pooler-transaction-rw.database.svc.cluster.local\"\n    port: 5432\n    connect_timeout:
    \n    keepalives: \n    keepalives_idle: \n    keepalives_interval: \n    keepalives_count:
    \n    tcp_user_timeout: \n    application_name: \n    prepared_statements: false\n
    \   database_tasks: true\n    \n    \n"
  gitlab.yml.erb: "production: &base\n  gitlab:\n    host: gitlab...PLACEHOLDER_SECRET_DOMAIN..\n
    \   https: true\n  artifacts:\n    enabled: false\n    object_store:\n      enabled:
    false\n      remote_directory: gitlab-artifacts\n      proxy_download: true\n
    \ lfs:\n    enabled: false\n    object_store:\n      enabled: false\n      remote_directory:
    git-lfs\n      proxy_download: true\n  uploads:\n    enabled: false\n    object_store:\n
    \     enabled: false\n      remote_directory: gitlab-uploads\n      proxy_download:
    true\n  packages:\n    enabled: false\n    object_store:\n      enabled: false\n
    \     remote_directory: gitlab-packages\n      proxy_download: true\n  external_diffs:\n
    \   enabled: false\n    when: \n    object_store:\n      enabled: false\n      remote_directory:
    gitlab-mr-diffs\n      proxy_download: true\n  terraform_state:\n    enabled:
    false\n    object_store:\n      enabled: false\n      remote_directory: gitlab-terraform-state\n
    \     proxy_download: true\n  ci_secure_files:\n    enabled: false\n    object_store:\n
    \     enabled: false\n      remote_directory: gitlab-ci-secure-files\n      proxy_download:
    true\n  agent_plan_content:\n    enabled: false\n    object_store:\n      enabled:
    false\n      remote_directory: gitlab-agent-plan-content\n      proxy_download:
