    # END gitlab.scripts.configure.secrets
  gitlab-exporter.yml.erb: "server:\n  name: webrick\n  listen_address: \"*\"\n  listen_port:
    9168\n  \n\nprobes:\n  db_common: &db_common\n    methods:\n      - probe_db\n
    \   opts:\n      connection_string: dbname=gitlab user=gitlab host=pooler-transaction-rw.database.svc.cluster.local
    port=5432 password='<%= File.read('/etc/gitlab/postgres/psql-password-main').strip.gsub(/[\\'\\\\]/)
    { |esc| '\\\\' + esc } %>'\n  database:\n    multiple: true\n    ci_builds:\n
    \     class_name: Database::CiBuildsProber\n      <<: *db_common\n    tuple_stats:\n
    \     class_name: Database::TuplesProber\n      <<: *db_common\n    rows_count:\n
    \     class_name: Database::RowCountProber\n      <<: *db_common\n  database_bloat:\n
    \   class_name: Database::BloatProber\n    <<: *db_common\n\n  sidekiq: &sidekiq\n
    \   methods:\n      - probe_queues\n      - probe_workers\n      - probe_retries\n
    \     - probe_stats\n    opts:\n      redis_url: redis://:<%= ERB::Util::url_encode(File.read(\"/etc/gitlab/redis/redis-password\").strip)
    %>@gitlab-valkey:6379/0\n      \n      redis_enable_client: false\n      probe_non_namespaced:
    true\n\n  ruby: &ruby\n    methods:\n      - probe_gc\n    opts:\n      quantiles:
    false\n\n  metrics:\n    multiple: true\n    ruby:\n      <<: *ruby\n    sidekiq:\n
    \     <<: *sidekiq\n    ci_builds:\n      class_name: Database::CiBuildsProber\n
    \     <<: *db_common\n    tuple_stats:\n      class_name: Database::TuplesProber\n
